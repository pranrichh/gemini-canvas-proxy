# ─────────────────────────────────────────────────────────────────────────────
# VPS / Tailscale override
#
# Merges on top of docker-compose.yml and publishes both the proxy API (8765)
# and the noVNC UI (6080) on every interface, so a tailnet address such as
# 100.x.y.z can reach them.
#
#   docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d
#
# The `!override` tag matters. Compose appends port lists when merging files, so
# without it you end up asking Docker to publish 0.0.0.0:6080 *and*
# 127.0.0.1:6080, and the container refuses to start with
# "failed to bind host port 127.0.0.1:6080/tcp: address already in use".
# `!override` replaces the list instead of extending it.
#
# Security:
#   - The proxy requires the bearer token generated on first start. That is
#     authentication, not isolation: keep 8765 behind Tailscale or another
#     private mesh, and keep the token out of shell history and compose files.
#   - noVNC has no password. Anyone who can reach 6080 can drive the in-container
#     Chromium and see the session. Same rule: private network in front, or
#     terminate the port mapping at a local reverse proxy that authenticates.
# ─────────────────────────────────────────────────────────────────────────────

services:
  proxy:
    ports: !override
      - "6080:6080"
      - "8765:8765"

    environment:
      # Bind all interfaces inside the container too, so the published ports
      # have something to forward to.
      PROXY_BIND: 0.0.0.0
      PROXY_PORT: "8765"
      NOVNC_PORT: "6080"
