<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1932 1932" width="1932" height="1932">
  <defs>
    <!-- Star outline -->
    <path id="star" d="M925 100 Q935 62 965 62 Q995 62 1005 100
      C1050 290 1150 480 1300 630
      C1480 780 1680 880 1835 925 Q1870 940 1868 965 Q1870 990 1835 1005
      C1680 1050 1480 1150 1300 1300
      C1150 1450 1050 1640 1005 1830 Q995 1868 965 1868 Q935 1868 925 1830
      C880 1640 780 1450 630 1300
      C450 1150 250 1050 95 1005 Q62 990 62 965 Q62 940 95 925
      C250 880 450 780 630 630
      C780 480 880 290 925 100 Z"/>
    <clipPath id="starClip"><use href="#star"/></clipPath>
    <clipPath id="outerClip"><circle cx="965" cy="965" r="490"/></clipPath>
    <clipPath id="innerClip"><circle cx="965" cy="965" r="445"/></clipPath>

    <filter id="b30" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="b15" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="15"/></filter>
    <filter id="b50" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
    <filter id="b6" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="4"/></filter>

    <!-- Star spike gradients -->
    <linearGradient id="gTop" gradientUnits="userSpaceOnUse" x1="0" y1="65" x2="0" y2="620">
      <stop offset="0" stop-color="#ffa6dc"/>
      <stop offset="0.25" stop-color="#ff5cae"/>
      <stop offset="0.6" stop-color="#ff1f86"/>
      <stop offset="1" stop-color="#ff40a8"/>
    </linearGradient>
    <linearGradient id="gRight" gradientUnits="userSpaceOnUse" x1="1300" y1="0" x2="1868" y2="0">
      <stop offset="0" stop-color="#0010ff"/>
      <stop offset="0.6" stop-color="#1030ff"/>
      <stop offset="1" stop-color="#8a98ff"/>
    </linearGradient>
    <linearGradient id="gLeft" gradientUnits="userSpaceOnUse" x1="62" y1="0" x2="640" y2="0">
      <stop offset="0" stop-color="#ffc060"/>
      <stop offset="0.2" stop-color="#ff9a28"/>
      <stop offset="0.7" stop-color="#ff8a18"/>
      <stop offset="1" stop-color="#ff7a20"/>
    </linearGradient>
    <linearGradient id="gBottom" gradientUnits="userSpaceOnUse" x1="0" y1="1300" x2="0" y2="1868">
      <stop offset="0" stop-color="#a8ff40"/>
      <stop offset="0.3" stop-color="#58ff38"/>
      <stop offset="0.7" stop-color="#3aa844"/>
      <stop offset="1" stop-color="#6a9a6c"/>
    </linearGradient>
    <linearGradient id="gYellowBL" gradientUnits="userSpaceOnUse" x1="250" y1="1000" x2="800" y2="1500">
      <stop offset="0" stop-color="#ffd830" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#ffff30"/>
      <stop offset="1" stop-color="#c0ff40"/>
    </linearGradient>
    <linearGradient id="gBlueBR" gradientUnits="userSpaceOnUse" x1="1000" y1="1450" x2="1300" y2="1250">
      <stop offset="0" stop-color="#30b0c0"/>
      <stop offset="0.5" stop-color="#2a90e0"/>
      <stop offset="1" stop-color="#1a40ff"/>
    </linearGradient>
    <linearGradient id="gLavender" gradientUnits="userSpaceOnUse" x1="1040" y1="400" x2="1300" y2="600">
      <stop offset="0" stop-color="#ff88ee" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#ff90f0"/>
      <stop offset="0.7" stop-color="#c0a0ff"/>
      <stop offset="1" stop-color="#2040ff"/>
    </linearGradient>

    <!-- Ring gradients: sectors -->
    <linearGradient id="rTop" gradientUnits="userSpaceOnUse" x1="640" y1="0" x2="1290" y2="0">
      <stop offset="0" stop-color="#ff4a50"/>
      <stop offset="0.3" stop-color="#ff70d8"/>
      <stop offset="0.55" stop-color="#d890ff"/>
      <stop offset="0.8" stop-color="#4aa0ff"/>
      <stop offset="1" stop-color="#00b8ff"/>
    </linearGradient>
    <linearGradient id="rLeft" gradientUnits="userSpaceOnUse" x1="0" y1="640" x2="0" y2="1290">
      <stop offset="0" stop-color="#ff3a40"/>
      <stop offset="0.25" stop-color="#ff8420"/>
      <stop offset="0.5" stop-color="#ffd800"/>
      <stop offset="0.8" stop-color="#9aff30"/>
      <stop offset="1" stop-color="#40ff60"/>
    </linearGradient>
    <linearGradient id="rBottom" gradientUnits="userSpaceOnUse" x1="640" y1="0" x2="1290" y2="0">
      <stop offset="0" stop-color="#7cff3a"/>
      <stop offset="0.4" stop-color="#20f0a0"/>
      <stop offset="0.7" stop-color="#10d8f0"/>
      <stop offset="1" stop-color="#3a9cff"/>
    </linearGradient>
    <linearGradient id="rRight" gradientUnits="userSpaceOnUse" x1="0" y1="640" x2="0" y2="1290">
      <stop offset="0" stop-color="#10a8ff"/>
      <stop offset="0.35" stop-color="#6060ff"/>
      <stop offset="0.6" stop-color="#a040ff"/>
      <stop offset="1" stop-color="#3090ff"/>
    </linearGradient>

    <!-- Inner disc gradients -->
    <linearGradient id="dTop" gradientUnits="userSpaceOnUse" x1="560" y1="0" x2="1420" y2="0" gradientTransform="rotate(20 965 965)">
      <stop offset="0" stop-color="#10f4ff"/>
      <stop offset="0.3" stop-color="#10f4ff"/>
      <stop offset="0.45" stop-color="#20c010"/>
      <stop offset="0.6" stop-color="#e8c000"/>
      <stop offset="0.72" stop-color="#ffa000"/>
      <stop offset="0.9" stop-color="#ffd800"/>
      <stop offset="1" stop-color="#ffee00"/>
    </linearGradient>
    <linearGradient id="dBottom" gradientUnits="userSpaceOnUse" x1="560" y1="0" x2="1420" y2="0" gradientTransform="rotate(20 965 965)">
      <stop offset="0" stop-color="#0000f4"/>
      <stop offset="0.3" stop-color="#0000f0"/>
      <stop offset="0.42" stop-color="#ff00c8"/>
      <stop offset="0.52" stop-color="#ff1010"/>
      <stop offset="0.64" stop-color="#ff8000"/>
      <stop offset="0.8" stop-color="#ffd800"/>
      <stop offset="1" stop-color="#ffee00"/>
    </linearGradient>
    <linearGradient id="dFade" gradientUnits="userSpaceOnUse" x1="0" y1="860" x2="0" y2="1160">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="dMask"><rect x="500" y="500" width="930" height="930" fill="url(#dFade)"/></mask>
    <linearGradient id="dLeftMid" gradientUnits="userSpaceOnUse" x1="520" y1="0" x2="900" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.5" stop-color="#40ff90"/>
      <stop offset="1" stop-color="#60ff90" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dRightMid" gradientUnits="userSpaceOnUse" x1="1000" y1="0" x2="1420" y2="0">
      <stop offset="0" stop-color="#ffb000" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffd800"/>
      <stop offset="1" stop-color="#ffff00"/>
    </linearGradient>

    <!-- Arrow gradients -->
    <linearGradient id="arrow" gradientUnits="userSpaceOnUse" x1="610" y1="0" x2="1325" y2="0">
      <stop offset="0" stop-color="#66ff99"/>
      <stop offset="0.12" stop-color="#5af8a0"/>
      <stop offset="0.35" stop-color="#3a9cff"/>
      <stop offset="0.6" stop-color="#1448ff"/>
      <stop offset="0.85" stop-color="#0010ff"/>
      <stop offset="1" stop-color="#0000ff"/>
    </linearGradient>
    <linearGradient id="bevelU" gradientUnits="userSpaceOnUse" x1="1040" y1="740" x2="1190" y2="830">
      <stop offset="0" stop-color="#4040b0"/>
      <stop offset="1" stop-color="#2a60b8"/>
    </linearGradient>
    <linearGradient id="bevelL" gradientUnits="userSpaceOnUse" x1="890" y1="1190" x2="740" y2="1100">
      <stop offset="0" stop-color="#0a8aa8"/>
      <stop offset="1" stop-color="#1a78b0"/>
    </linearGradient>
    <linearGradient id="gapGlow" gradientUnits="userSpaceOnUse" x1="610" y1="0" x2="1325" y2="0">
      <stop offset="0" stop-color="#ffb000" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#ff40a0" stop-opacity="0.7"/>
      <stop offset="0.3" stop-color="#ff9a10"/>
      <stop offset="0.7" stop-color="#ffd000"/>
      <stop offset="1" stop-color="#ffff00"/>
    </linearGradient>
  </defs>

  

  <!-- STAR -->
  <g clip-path="url(#starClip)">
    <g filter="url(#b30)">
      <polygon points="560,-100 1380,-100 1380,640 965,965 560,640" fill="url(#gTop)"/>
      <polygon points="1290,560 2030,560 2030,1370 1290,1370 965,965" fill="url(#gRight)"/>
      <polygon points="-100,560 640,560 965,965 640,1370 -100,1370" fill="url(#gLeft)"/>
      <polygon points="560,1290 1380,1290 1380,2030 560,2030" fill="url(#gBottom)"/>
      <polygon points="-100,1000 700,1100 900,1500 560,1700 -100,1400" fill="url(#gYellowBL)"/>
      <polygon points="1000,1500 1250,1250 1400,1350 1150,1700" fill="url(#gBlueBR)"/>
      <polygon points="1030,380 1180,420 1330,640 1200,640" fill="url(#gLavender)" opacity="0.9"/>
    </g>
  </g>

  <g transform="translate(965 965) scale(0.968) translate(-965 -965)">
  <!-- Ring -->
  <g clip-path="url(#outerClip)">
    <g filter="url(#b15)">
      <rect x="640" y="440" width="650" height="260" fill="url(#rTop)"/>
      <rect x="440" y="640" width="260" height="650" fill="url(#rLeft)"/>
      <rect x="640" y="1230" width="650" height="260" fill="url(#rBottom)"/>
      <rect x="1230" y="640" width="260" height="650" fill="url(#rRight)"/>
      <circle cx="680" cy="680" r="90" fill="#ff4050"/>
      <circle cx="1300" cy="660" r="80" fill="#10b0ff"/>
      <circle cx="1280" cy="1290" r="80" fill="#38a0ff"/>
      <circle cx="680" cy="1280" r="90" fill="#a8ff30"/>
    </g>
  </g>

  <!-- Inner disc -->
  <g clip-path="url(#innerClip)">
    <rect x="500" y="500" width="930" height="930" fill="url(#dTop)"/>
    <g filter="url(#b6)">
      <rect x="500" y="500" width="930" height="930" fill="url(#dBottom)" mask="url(#dMask)"/>
    </g>
    <rect x="500" y="640" width="400" height="330" fill="url(#dLeftMid)" opacity="0.9" filter="url(#b30)"/>
    <rect x="1000" y="700" width="430" height="300" fill="url(#dRightMid)" opacity="0.85" filter="url(#b30)"/>
    <ellipse cx="1330" cy="800" rx="150" ry="120" fill="#ffc000" opacity="0.7" filter="url(#b30)"/>
    <ellipse cx="900" cy="1010" rx="260" ry="40" fill="#ff7a60" opacity="0.5" filter="url(#b30)"/>
    <ellipse cx="760" cy="1020" rx="130" ry="50" fill="#1020ff" opacity="0.8" filter="url(#b15)"/>
    <ellipse cx="700" cy="1260" rx="180" ry="120" fill="#0000f0" filter="url(#b30)"/>
  </g>
  <!-- thin inner edge highlight -->
  <circle cx="965" cy="965" r="445" fill="none" stroke="#2a78c8" stroke-opacity="0.35" stroke-width="4"/>

  <!-- Gap between arrows -->
  <rect x="610" y="945" width="715" height="42" fill="url(#gapGlow)" filter="url(#b6)"/>

  <!-- Upper arrow -->
  <polygon points="610,840 1115,838 1038,772 1048,722 1170,714 1325,845 1325,942 610,948" fill="url(#arrow)"/>
  <polygon points="1048,722 1195,812 1115,838 1038,772" fill="url(#bevelU)"/>

  <!-- Lower arrow -->
  <polygon points="1324,1090 819,1092 896,1158 886,1208 764,1216 609,1085 609,988 1324,982" fill="url(#arrow)"/>
  <polygon points="886,1208 739,1118 819,1092 896,1158" fill="url(#bevelL)"/>  </g></svg>
