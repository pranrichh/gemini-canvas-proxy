name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.8 is the documented floor, 3.12 is what the container ships.
        # 3.8 is only in the toolcache on the older images: ubuntu-latest moved
        # to 26.04, which no longer offers it, so that leg failed on setup
        # rather than on a test.
        include:
          - python-version: "3.8"
            os: ubuntu-22.04
          - python-version: "3.12"
            os: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The service worker cannot be reached from Python, and its worst bug only
      # appears after Chrome evicts it mid-request. This stubs the chrome API and
      # replays that exact state.
      - name: Check the service-worker relay guard
        run: node tests/extension/relay-guard.js

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check docs against the source
        run: python3 scripts/check_docs.py .
